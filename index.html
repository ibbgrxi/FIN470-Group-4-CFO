 }).join('');
 const documentXML=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${paragraphs}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1080" w:right="1050" w:bottom="1080" w:left="1050"/></w:sectPr></w:body></w:document>`;
 const contentTypes=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`;
 const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
 const entries=[['[Content_Types].xml',enc.encode(contentTypes)],['_rels/.rels',enc.encode(rels)],['word/document.xml',enc.encode(documentXML)]];
 const crcTable=Array.from({length:256},(_,i)=>{let c=i;for(let j=0;j<8;j++)c=c&1?0xEDB88320^(c>>>1):c>>>1;return c>>>0});
 const crc32=a=>{let c=0xffffffff;for(const b of a)c=crcTable[(c^b)&255]^(c>>>8);return(c^0xffffffff)>>>0};
 const parts=[],central=[];let offset=0;

 }).join('');

 const el=document.createElement('div');el.className='speaking-overlay'+(ui.theme==='dark'?' dark':'');el.id='tele-overlay';
 el.innerHTML=`<div class="speaking-top"><div class="row"><strong>${esc(presenterDisplay())} · GROUP 4A + 4B</strong><span class="badge proposal">08:00 FULL</span><span class="badge neutral" id="tele-part">4A · SLIDE 1/7</span></div><div class="row"><span class="speaking-time" id="tele-clock">08:00</span><button class="btn small" id="tele-play">${icon('play',14)} Start</button><button class="btn outline small" id="tele-reset">Restart</button><button class="btn outline small" id="tele-exit">Exit</button></div><div class="row"><label class="micro" for="tele-speed">Auto-scroll pace</label><input id="tele-speed" type="range" min="60" max="140" value="100" aria-label="Điều chỉnh tốc độ cuộn chữ"><span class="micro" id="tele-speed-label">100%</span><span class="micro">${totalWords} words</span></div></div><div class="speaking-body" id="tele-body">${body}</div>`;

function elapsedTele(){return tele.running?(performance.now()-tele.started)/1000:tele.paused}
function teleRecalculate(){
 if(!tele.root?.isConnected)return;
 const body=tele.root.querySelector('#tele-body');
 tele.sections=Array.from(body.querySelectorAll('.tele-slide'));
 const first=tele.sections[0];if(!first)return;
 const maxScroll=Math.max(0,body.scrollHeight-body.clientHeight);
 // Continuous keyframes: at each slide boundary, the next heading reaches the reading zone.
 tele.anchors=tele.sections.map(s=>({
  t:Number(s.dataset.start),
  y:Math.min(maxScroll,Math.max(0,s.offsetTop-34))
 }));
 tele.anchors.push({t:480,y:maxScroll});
}
function teleScrollPosition(t){
 const points=tele.anchors;
 if(!points?.length)return 0;
 if(t<=0)return 0;
 if(t>=480)return points.at(-1).y;
 let i=0;
 while(i<points.length-2 && t>=points[i+1].t)i++;
 const a=points[i],b=points[i+1],dt=b.t-a.t;
 if(dt<=0)return a.y;
 const u=Math.max(0,Math.min(1,(t-a.t)/dt));
 // Monotonic cubic Hermite interpolation: both position and speed are continuous
 // across slide boundaries (avoids plateau-and-jump at e.g. 140% pace).
 const slope=j=>(points[j+1].y-points[j].y)/(points[j+1].t-points[j].t);
 const tangent=j=>{
  if(j===0)return slope(0);
  if(j===points.length-1)return slope(j-1);
  const x=slope(j-1),y=slope(j);
  if(x<=0||y<=0)return 0;
  return 2*x*y/(x+y);
 };
 const m0=tangent(i)*dt,m1=tangent(i+1)*dt,u2=u*u,u3=u2*u;
 return Math.max(a.y,Math.min(b.y,(2*u3-3*u2+1)*a.y+(u3-2*u2+u)*m0+(-2*u3+3*u2)*b.y+(u3-u2)*m1));
}
function teleRenderAt(t){
 if(!tele.root?.isConnected||!tele.anchors?.length)return;
 const sections=tele.sections;
 let i=0;
 while(i<sections.length-1 && t>=Number(sections[i+1].dataset.start))i++;
 const body=tele.root.querySelector('#tele-body');
 // Direct position update (one write/frame); no competing browser smooth-scroll animation.
 body.scrollTop=teleScrollPosition(t);
 if(tele.currentIndex!==i){
  if(tele.currentIndex>=0)sections[tele.currentIndex]?.classList.remove('tele-current-slide');
  sections[i].classList.add('tele-current-slide');tele.currentIndex=i;
  const s=sections[i];tele.root.querySelector('#tele-part').textContent=`${s.dataset.group} · SLIDE ${s.dataset.slide}/7${s.dataset.group==='4B'?' · CONTINUING':''}`;
 }
}
function tickTele(now){
 if(!tele.running||!tele.root?.isConnected)return;
 const total=tele.total||480,dt=Math.max(0,Math.min(0.1,(now-tele.lastFrame)/1000));
 tele.lastFrame=now;
 const elapsed=(now-tele.started)/1000;
 // Scroll pace changes text motion smoothly without distorting the 8-minute timer.
 tele.scrollTime=Math.min(total,tele.scrollTime+dt*(tele.speed/100));
 teleRenderAt(tele.scrollTime);
 const second=Math.floor(Math.max(0,total-elapsed));
 if(tele.lastSecond!==second){
  tele.lastSecond=second;
  const clock=tele.root.querySelector('#tele-clock');
  clock.textContent=elapsed>total?'+'+Math.floor(elapsed-total)+'s':`${String(Math.floor(second/60)).padStart(2,'0')}:${String(second%60).padStart(2,'0')}`;
  clock.className='speaking-time'+(elapsed>total?' overtime':second<total*.2?' warning':'');
 }
 if(elapsed>=total){
  tele.running=false;tele.paused=total;tele.root.querySelector('#tele-play').textContent='Start again';return;
 }
 tele.handle=requestAnimationFrame(tickTele);
}

document.addEventListener('keydown',e=>{if(!member)return;if(ui.live&&e.target.tagName!=='INPUT'&&e.target.tagName!=='TEXTAREA'&&e.target.tagName!=='SELECT'){if(/^[1-8]$/.test(e.key)){e.preventDefault();persistUI({role:ROLES[Number(e.key)-1].id});return}if(e.key==='?'){e.preventDefault();toast('1–8 switch roles · Enter submits Quick Capture · Ctrl/Cmd+S stars most recent note');return}}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();const n=[...S.notes].filter(n=>n.role===ui.role).at(-1);if(n){dispatch('updateNote',{id:n.id,patch:{starred:!n.starred}}).then(()=>render(true));toast('Starred latest note')}return}
});
window.addEventListener('online',()=>flushQueue());
document.addEventListener('visibilitychange',()=>updateMemberPresence());
window.addEventListener('pageshow',()=>updateMemberPresence());
window.addEventListener('pagehide',sendPresenceLeave);
document.addEventListener('click',e=>{
 if(presenceOpen&&!e.target.closest('#team-presence')){
  presenceOpen=false;document.querySelector('#team-presence')?.classList.remove('open');
  document.querySelector('[data-action=presence-toggle]')?.setAttribute('aria-expanded','false');
 }
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&presenceOpen){presenceOpen=false;document.querySelector('#team-presence')?.classList.remove('open');document.querySelector('[data-action=presence-toggle]')?.setAttribute('aria-expanded','false')}
});

initialize();
