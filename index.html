function groupedPresence(){
 const map=new Map();
 for(const p of presence){
  if(!p||!p.name||!p.group)continue;
  const key=p.name+'|'+p.group;
  const old=map.get(key);
  if(!old||(old.status!=='online'&&p.status==='online'))map.set(key,p);
 }
 const roster=MEMBERS.map(x=>{
  const p=map.get(x.name+'|'+x.group);
  map.delete(x.name+'|'+x.group);
  return {name:x.name,group:x.group,color:x.color,status:p?.status||'offline',location:p?.location||'',id:p?.id||''};
 });
 for(const p of map.values())roster.push({...p,color:p.color||'#667589'});
 return roster.sort((a,b)=>({online:0,away:1,offline:2}[a.status]??2)-({online:0,away:1,offline:2}[b.status]??2)||a.name.localeCompare(b.name,'vi'));
}
function sidebarPresenceRows(){

  const label=status==='online'?'Đang hoạt động':status==='away'?'Tạm vắng':'Ngoại tuyến';
  const initials=p.name.split(' ').slice(-2).map(w=>w[0]||'').join('').toUpperCase();
  const where=status==='offline'?'Chưa online':status==='away'?'Đang ở tab khác · '+pageTitleFromId(p.location):'Đang xem: '+pageTitleFromId(p.location);

 }).join('');

function applyLocal(message){
 const op=message.op;switch(op){
 case 'addNote':if(message.note&&!S.notes.some(n=>n.id===message.note.id))S.notes.push(message.note);break;
 case 'updateNote':{const n=S.notes.find(x=>x.id===message.id);if(n)Object.assign(n,message.patch);break}
 case 'deleteNote':{
  const original=S.notes.find(n=>n.id===message.id);
  if(original){S.deletedNotes??=[];S.deletedNotes.unshift({...original,deletedBy:message.deletedBy||identity().name,deletedAt:message.deletedAt||new Date().toISOString()});S.deletedNotes=S.deletedNotes.slice(0,300);}
  S.notes=S.notes.filter(n=>n.id!==message.id);
  if(S.cfoDecisions)delete S.cfoDecisions[message.id];
  for(const b of Object.keys(S.synthesis||{}))if(S.synthesis[b]===message.id)S.synthesis[b]='';
  break;
 }
 case 'setSynthesis':S.synthesis[message.block]=message.noteId;break;
 case 'setDifference':S.differences[message.key]=message.value;break;
 case 'setRoleSummary':S.summaries[message.key]=message.value;break;
 case 'setWorksheet':S.worksheet[message.key]=message.value;break;
 case 'setSpeaker':S.speakers[message.key]=message.value;break;
 case 'setScore':S.scores[message.key]=message.value;break;
 case 'setRoleAssignment':S.roleAssignments[message.key]=message.value;break;
 case 'setScriptCustom':S.scriptCustom[message.key]=message.value;break;
 case 'setConflict':S.conflicts[message.id]??={status:'Open'};S.conflicts[message.id][message.field]=message.value;break;
 case 'setCondition':S.conditions[message.index][message.field]=message.value;break;
 case 'setKpi':S.kpis[message.index][message.field]=message.value;break;
 case 'setResolution':S.resolution[message.field]=message.value;break;
 case 'setCfoDecision':S.cfoDecisions??={};S.cfoDecisions[message.id]??={decision:'PENDING',response:'',impact:'',linkTo:'',owner:''};S.cfoDecisions[message.id][message.field]=message.value;break;
 case 'setBoardOutcome':S.boardOutcome??={decision:'',announcedBy:'',announcedAt:'',conditions:'',dissent:'',notes:''};S.boardOutcome[message.field]=message.value;break;
 case 'setScenarioPreset':{
  const presets={A:{dso:65,doh:105},B:{dso:14.4/100*365,doh:18.4/100*15000/10500*365},C:{dso:10/100*365,doh:15/100*15000/10500*365}};
  if(presets[message.mode]) S.scenario={...presets[message.mode],mode:message.mode};
  break;
 }
 case 'setScenario':{
  S.scenario??={dso:65,doh:105,mode:'A'};
  S.scenario[message.field]=message.value;
  if(['dso','doh'].includes(message.field))S.scenario.mode='custom';
  break;
 }
 case 'setCcc':S.cccInputs??={ar:'',inv:'',ap:'',source:''};S.cccInputs[message.field]=message.value;break;
 case 'setSensitivity':S.sensitivity??={gain:320,warranty:1.6,tax:''};S.sensitivity[message.field]=message.value;break;
 case 'setForecast':{
  S.forecast??=Array.from({length:13},()=>({opening:'',inflows:'',outflows:'',facility:'',essential:''}));
  if(S.forecast[message.index])S.forecast[message.index][message.field]=message.value;
  break;
 }
 case 'setKpiActual':S.kpiActuals??={};S.kpiActuals[`${message.index}-${message.quarter}`]=message.value;break;
 case 'setCommitment':S.commitments??=[];if(S.commitments[message.index])S.commitments[message.index][message.field]=message.value;break;
 case 'setEvidenceRequest':S.evidenceRequests??=[];if(S.evidenceRequests[message.index])S.evidenceRequests[message.index][message.field]=message.value;break;
 case 'setStageGate':S.stageGates??=[];S.stageGates[message.index]=message.value;break;
 case 'setScanText':S.scanText=message.value;break;
 case 'setConfidence':S.confidence=message.value;break;
 case 'setChecklist':S.checklist[message.key]=message.value;break;
 case 'snapshotResolution':if(message.version){S.versions.unshift(message.version);S.resolution.version=(S.resolution.version||0)+1}break;
 case 'restoreResolution':if(message.restored){S.resolution=message.restored.resolution;S.conditions=message.restored.conditions;S.kpis=message.restored.kpis;S.synthesis=message.restored.synthesis}break;
 case 'voteFinal':S.resolution.votes=message.votes;S.resolution.status=message.status;break;
 case 'resetVotes':S.resolution.votes=[];break;
 case 'addQuestion':if(message.question&&!S.questions.some(q=>q.id===message.question.id))S.questions.push(message.question);break;
 case 'updateQuestion':{const q=S.questions.find(q=>q.id===message.id);if(q)q[message.field]=message.value;break}
 }
 stateSaveLocal();
}
const identity=()=>member||{name:'Local learner',group:'4A',color:'#0F6B5C',id:'local'};
async function dispatch(op,payload={}){
 const local={op,...payload};if(op==='addNote'){
  local.note={...payload.note,id:payload.note.id||uuid(),tag:payload.note.type==='BOARD RESPONSE'?'BOARD PROPOSAL':'LIVE',author:identity().name,authorId:identity().id,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
 }
 if(op==='snapshotResolution'&&!serverMode){local.version={id:uuid(),at:new Date().toISOString(),author:identity().name,data:JSON.parse(JSON.stringify({resolution:S.resolution,conditions:S.conditions,kpis:S.kpis,synthesis:S.synthesis}))}}
 if(op==='voteFinal'){const votes=[...new Set([...(S.resolution.votes||[]),identity().name])];local.votes=votes;local.status=votes.length>=4?'REVIEWED DRAFT':S.resolution.status}
 if(op==='addQuestion'&&!serverMode)local.question={id:uuid(),q:payload.q,answer:'',owner:''};
 applyLocal(local);saveStatus='Đang lưu';updateSync();
 if(!serverMode){saveStatus='Đã lưu trên thiết bị';updateSync();return}
 try{
  const r=await fetch('/api/change',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({op,...payload,...(op==='addNote'?{note:local.note}:{})})});
  const out=await r.json();if(!r.ok&&r.status>=400&&r.status<500){const fresh=await fetch('/api/state',{credentials:'same-origin'});if(fresh.ok){const d=await fresh.json();S={...defaultState(),...d.state};stateSaveLocal();connected=true;saveStatus='Đã đồng bộ';render(true)}toast(out.error||'Server rejected this change',true);return}if(!r.ok)throw Error(out.error||'Save failed');if(out.applied)applyLocal(out.applied);connected=true;saveStatus='Đã đồng bộ';updateSync();
 }catch(e){connected=false;saveStatus='Chờ đồng bộ';offlineQueue.push({op,...payload,...(op==='addNote'?{note:local.note}:{})});localStorage.setItem('fin470_offline_queue',JSON.stringify(offlineQueue));updateSync();toast('Đang lưu tạm trên thiết bị. '+e.message,true)}
}
async function deleteNoteSafely(note){
 if(!note||!S.notes.some(n=>n.id===note.id))return;
 const names=new Set(MEMBERS.map(x=>x.name));
 if(!names.has(identity().name)){toast('Chỉ thành viên chính thức nhóm 4 có quyền xóa ghi chú.',true);return;}
 if(!window.confirm('Xóa ghi chú này khỏi workspace của tất cả thành viên?\n\n'+note.text.slice(0,220)+'\n\nDữ liệu xóa được lưu trong nhật ký để quản trị khôi phục thủ công khi cần.'))return;
 if(!serverMode){applyLocal({op:'deleteNote',id:note.id,deletedBy:identity().name,deletedAt:new Date().toISOString()});render(true);toast('Đã xóa ghi chú trên thiết bị.');return;}
 try{
  const r=await fetch('/api/change',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({op:'deleteNote',id:note.id})});
  const out=await r.json();
  if(!r.ok)throw Error(out.error||'Server từ chối thao tác xóa.');
  applyLocal(out.applied||{op:'deleteNote',id:note.id,deletedBy:identity().name});
  saveStatus='Đã đồng bộ';connected=true;updateSync();render(true);toast('Đã xóa và đồng bộ ghi chú.');
 }catch(e){toast('Chưa xóa: '+e.message+'. Kiểm tra kết nối và thử lại.',true);}
}
async function flushQueue(){if(!serverMode||!offlineQueue.length)return;const batch=[...offlineQueue];offlineQueue=[];for(const change of batch){try{const r=await fetch('/api/change',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(change)});if(!r.ok)throw Error();}catch{offlineQueue.push(change)}}localStorage.setItem('fin470_offline_queue',JSON.stringify(offlineQueue));if(!offlineQueue.length){saveStatus='Đã đồng bộ';connected=true;updateSync()}}
function updateSync(){document.querySelectorAll('[data-sync]').forEach(e=>e.textContent=syncedLabel());document.querySelectorAll('[data-status-dot]').forEach(e=>e.className='status-dot'+(connected||!serverMode?'':' offline'))}
function subscribe(){stream?.close();stream=new EventSource('/api/events');stream.addEventListener('open',()=>{connected=true;saveStatus='Đã đồng bộ';updateSync();updateMemberPresence();flushQueue()});stream.addEventListener('change',e=>{let d;try{d=JSON.parse(e.data)}catch{return};if(d.from===identity().id)return;applyLocal(d);if(!document.activeElement?.matches('textarea,input,[contenteditable]'))render(true);else updateCounters()});stream.addEventListener('presence',e=>{try{presence=JSON.parse(e.data)}catch{};renderPresenceUI()});stream.addEventListener('error',()=>{connected=false;updateSync()})}
function persistUI(updates){Object.assign(ui,updates);uiSave();render()}
function tryState(){try{return JSON.parse(localStorage.getItem(STORAGE)||'null')}catch{return null}}
async function initialize(){
 offlineQueue=JSON.parse(localStorage.getItem('fin470_offline_queue')||'[]');
 try{const r=await fetch('/api/state',{credentials:'same-origin'});if(r.status===401){renderLogin();return}if(!r.ok)throw Error('Server unavailable');const data=await r.json();S={...defaultState(),...data.state};member=data.member;connected=true;serverMode=true;subscribe();updateMemberPresence();startPresenceHeartbeat();render();}

le="height:17px"></div><div class="card"><div class="card-header"><h3>Six case details that change the decision</h3>${badge('CASE DATA')}</div><div class="grid cols-3">${facts.map((x,i)=>`<div class="stat"><span class="eyebrow">0${i+1}</span><h3 style="margin-top:9px">${esc(x[0])}</h3><p class="small">${esc(x[1])}</p><div class="micro" style="border-top:1px solid var(--line);padding-top:9px">${badge('GROUP INTERPRETATION')}<p style="margin-top:7px">${esc(x[2])}</p></div></div>`).join('')}</div></div><div style="height:17px"></div><div class="grid cols-2"><div class="card"><h3>Common task · PDF page 2</h3><ul class="list-clean"><li>Rate 2026 earnings quality: HIGH / MEDIUM / LOW.</li><li>Use ≥5 evidence points, including cash, balance sheet and unusual item / estimate.</li><li>Offer two plausible Management explanations; do not automatically allege fraud.</li><li>Request three additional data packages.</li><li>Reach a decision consistent with assigned role.</li></ul></div><div class="card"><h3>Role R6 · CFO deliverables</h3><p><b>Financing plan + key assumptions + transparency commitments.</b></p><div class="requirement">How will we fund it? What will we disclose to outsiders? Which assumptions sit behind the numbers?</div><p class="small">Focus on financial diagnosis and working-capital/cash management; do not go deeply into WACC/DSCR. Session 3 does not specify an A3/slide limit in the supplied case.</p></div></div><div class="card" style="margin-top:17px"><div class="card-header"><h3>Session 3 hearing order · 21–23 Oct 2026</h3>${badge('CASE DATA')}</div><div class="grid cols-4">${ROLES.map(r=>`<div class="stakeholder" style="${r.id==='cfo'?'background:#e9f4ed;border-color:#87bca4':''}"><div class="idx" style="${r.id==='cfo'?'background:var(--teal);color:white':''}">${r.order}</div><div><div class="name">${esc(r.name)}</div><div class="meta">${r.groups.join(' + ')} · ${r.r}${r.id==='cfo'?' · YOUR ROLE':''}</div></div></div>`).join('')}</div><div class="notice" style="margin-top:15px">CFO presents second, after CEO. In Pre-talk, capture CEO’s actual claims; in Post-talk, listen to the remaining six roles. One selected presenter delivers Group 4A (5 min) followed by Group 4B (3 min), continuously.</div></div>${factsFoot()}`}
function financeTable(filter){const ids=filter==='profit'?['cfoNi','oneOff','grossMargin','operMargin']:filter==='working'?['arRev','invRev','dso','doh','proxy']:FIN.ratios.map(x=>x.id);const x=FIN.ratios.filter(r=>ids.includes(r.id));return `<div class="table-wrap"><table class="data-table"><thead><tr><th>Ratio</th><th class="num">2024</th><th class="num">2025</th><th class="num">2026</th><th>Origin</th><th></th></tr></thead><tbody>${x.map(r=>`<tr><td><b>${r.name}</b></td>${r.values.map((v,i)=>`<td class="num ${i===2&&r.id!=='grossMargin'?'underperform':''}">${num(v,r.id==='operMargin'?2:1)}${r.unit}</td>`).join('')}<td>${badge('GROUP INTERPRETATION')}</td><td><button class="mini" data-formula="${r.id}">Formula ${icon('arrow',12)}</button></td></tr>`).join('')}</tbody></table></div>`}
function cfoTrendChart(title,lines,opts={}){
 const W=720,H=278,left=55,right=22,top=23,bottom=48,chartW=W-left-right,chartH=H-top-bottom;
 const data=lines.flatMap(l=>l.values);const lo=opts.yMin??Math.floor(Math.min(0,...data)/20)*20;const hi=opts.yMax??Math.ceil((Math.max(...data)+4)/20)*20;
 const x=i=>left+i*chartW/2,y=v=>top+chartH-(v-lo)/(hi-lo)*chartH;
 const format=v=>`${num(v,opts.decimals??1)}${opts.suffix||''}`;
 let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(title)} trends 2024 to 2026" style="overflow:visible">`;
 for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,p=y(v);svg+=`<line x1="${left}" y1="${p}" x2="${W-right}" y2="${p}" stroke="#e2e9e5" stroke-dasharray="4 6"/><text x="${left-9}" y="${p+4}" text-anchor="end" fill="#6c7d78" font-size="11">${format(v)}</text>`}
 if(opts.reference!=null&&opts.reference>=lo&&opts.reference<=hi){const p=y(opts.reference);svg+=`<line x1="${left}" x2="${W-right}" y1="${p}" y2="${p}" stroke="#a63d2f" stroke-width="1.5" stroke-dasharray="6 5"/><text x="${W-right-3}" y="${p-7}" text-anchor="end" font-size="10" font-weight="700" fill="#a63d2f">${esc(opts.referenceLabel||'Reference')}</text>`}
 [2024,2025,2026].forEach((year,i)=>svg+=`<text x="${x(i)}" y="${H-17}" text-anchor="middle" font-size="12" fill="#697580">${year}</text>`);
 lines.forEach((line,li)=>{
  const c=line.color||'#0f6b5c';
  svg+=`<polyline fill="none" stroke="${c}" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" points="${line.values.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}"/>`;
  line.values.forEach((v,i)=>{
   svg+=`<circle cx="${x(i)}" cy="${y(v)}" r="4.5" stroke="white" stroke-width="2" fill="${c}"><title>${esc(line.name)} ${2024+i}: ${format(v)}</title></circle>`;
   if(opts.labelMode==='growth-clean'){
    // All three lines start at exactly 100: a single shared label avoids stacking.
    // Values for 2025 are printed in the accessible table beneath the plot.
    if(i===2)svg+=`<text x="${x(i)-11}" y="${y(v)-11}" text-anchor="end" font-size="12" font-weight="800" fill="${c}">${format(v)}</text>`;
   }else{
    svg+=`<text x="${x(i)}" y="${y(v)-12}" text-anchor="middle" font-size="11" font-weight="750" fill="${c}">${format(v)}</text>`;
   }
  });
 });
 if(opts.labelMode==='growth-clean')svg+=`<text x="${x(0)}" y="${y(100)-14}" text-anchor="middle" font-size="12" font-weight="800" fill="#536d68">100 · shared base</text>`;
 svg+='</svg>';return `<div class="chart-finance">${svg}<div class="row" style="justify-content:center;flex-wrap:wrap;gap:12px;margin-top:4px">${lines.map(l=>`<span class="micro" style="display:inline-flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:50%;background:${l.color}"></span>${esc(l.name)}</span>`).join('')}${opts.reference!=null?`<span class="micro">Reference: ${format(opts.reference)} (not a mandatory benchmark)</span>`:''}</div></div>`;
}
function cfoSupplementalCharts(tab){
 if(tab==='profit')return `<div class="grid cols-2" style="margin-top:15px"><div class="card"><div class="card-header"><h3>Cash conversion quality · CFO / NI</h3>${badge('GROUP INTERPRETATION')}</div>${cfoTrendChart('CFO-to-net-income ratio',[{name:'CFO / NI',values:[106.25,62,250/1150*100],color:'#0f6b5c'}],{yMin:0,yMax:120,suffix:'%',reference:100,referenceLabel:'100% analytical reference'})}<p class="micro">From 106.3% to 21.7%. 100% is a visual reference, not a universal industry requirement. CFO 2026 remained positive at 250bn.</p></div><div class="card"><div class="card-header"><h3>Core operating margin compression</h3>${badge('GROUP INTERPRETATION')}</div>${cfoTrendChart('Gross and core operating margins',[{name:'Gross margin',values:[30,29.6,30],color:'#c9a13b'},{name:'Core operating margin',values:[11.8,10.88,1420/15000*100],color:'#0f6b5c'}],{yMin:0,yMax:35,suffix:'%',decimals:2})}<p class="micro">Gross margin broadly stable near 30%; core operating margin declined from 11.80% to 9.47%. Cause cannot be established from the supplied cost breakdown.</p></div></div>`;
 if(tab==='working')return `<div class="card" style="margin-top:15px"><div class="card-header"><div><h3>Growth divergence · Revenue vs Receivables vs Inventory</h3><p class="card-sub">Indexed to 2024 = 100 so growth rates are comparable</p></div>${badge('GROUP INTERPRETATION')}</div><div class="cfo-growth-panel">${cfoTrendChart('Growth divergence indexed to 2024',[{name:'Revenue',values:[100,125,150],color:'#0f6b5c'},{name:'Receivables',values:[100,180,310],color:'#a63d2f'},{name:'Inventory',values:[100,2300/1500*100,3400/1500*100],color:'#c9a13b'}],{yMin:0,yMax:350,decimals:0,labelMode:'growth-clean'})}<div class="cfo-growth-table table-wrap"><table class="data-table"><thead><tr><th>Index (2024 = 100)</th><th class="num">2024</th><th class="num">2025</th><th class="num">2026</th></tr></thead><tbody><tr><td>Revenue</td><td class="num">100</td><td class="num">125</td><td class="num">150</td></tr><tr><td>Receivables</td><td class="num">100</td><td class="num">180</td><td class="num">310</td></tr><tr><td>Inventory</td><td class="num">100</td><td class="num">153.3</td><td class="num">226.7</td></tr></tbody></table></div></div><p class="micro">2024–2026: revenue +50%; receivables +210%; inventory +126.7%. The chart is an index, not absolute VND bn and not receivables/revenue ratios.</p></div>`;
 return '';
}
function financePage(){const t=ui.finance||'profit';const selected=FIN.ratios.find(r=>r.id===ui.editMetric);return `${header('B','Financial Diagnosis','The same structured analysis as the Board demo, using VDG Session 3 numbers only.',printButton())}<div class="tabbar">${[['profit','Earnings & Cash'],['working','Working Capital / CCC'],['quality','Earnings Quality Scorecard'],['limitations','Data limitations']].map(([x,n])=>`<button class="tab ${t===x?'selected':''}" data-fin-tab="${x}">${n}</button>`).join('')}</div>${t==='limitations'?`<div class="grid cols-2"><div class="card"><h3>Not available in the case</h3><ul class="list-clean"><li>Accounts payable, DPO and average working-capital balances.</li><li>Indirect-method NI-to-CFO reconciliation.</li><li>Tax impact of selling the warehouse.</li><li>Warranty provision roll-forward and detailed claim settlement history.</li><li>SKU-level inventory and accounts receivable aging.</li><li>2027 capital requirement, borrowing amount or terms.</li></ul></div><div class="card"><div class="notice warning">Do not report 193.6 days as CCC. It is only the year-end proxy DSO + DOH. Do not report mechanical 830 / 725 as an audited net income normalization.</div><h3 style="margin-top:20px">Defensible conclusion</h3><p>These evidence gaps justify conditioned approval and verification, not an assumption that the company is fraudulent or destined to fail.</p>${badge('GROUP INTERPRETATION')}</div></div>`:t==='quality'?`<div class="grid cols-2"><div class="card"><h3>Five earnings-quality lenses</h3>${[['Cash conversion','CFO/NI: 106.3% → 21.7%','Weak'],['Accrual intensity','AR +210%, inventory +126.7%, sales +50%','Elevated risk'],['Sustainability','Warehouse sale gain 320bn not recurring','Weak'],['Balance-sheet evidence','Year-end AR 3,100bn; stock 3,400bn','Verify'],['Incentives & governance','Sales/EPS bonus and planned fundraise','Watch closely']].map(x=>`<div class="metricline"><div><strong class="small">${x[0]}</strong><div class="micro">${x[1]}</div></div><span class="badge warn">${x[2]}</span></div>`).join('')}</div><div class="card"><h3>Evidence for LOW classification</h3><ul class="list-clean"><li>2026 CFO = 250, a 59.7% annual decline.</li><li>CFO/NI = 21.7%, down 84.5 percentage points from 2024.</li><li>Receivables / sales = 20.7%, up from 10%.</li><li>Inventory / sales = 22.7%, up from 15%.</li><li>Warehouse gain = 27.8% of net income.</li><li>Warranty expense ratio fell 1.6% → 0.9% although claims did not materially decline.</li></ul><div class="notice">Red flags are questions to investigate, not proof of fraud. An unmodified audit opinion does not certify future cash conversion.</div></div></div>`:`<div class="grid cols-2"><div class="card"><div class="card-header"><h3>${t==='profit'?'Operating cash flow vs net income':'DSO / DOH proxy days'}</h3>${badge('GROUP INTERPRETATION')}</div>${chartLines(t==='profit'?[{name:'Net income · VND bn',values:[800,1000,1150],color:'#0f6b5c'},{name:'Operating CFO · VND bn',values:[850,620,250],color:'#a63d2f'}]:[{name:'DSO · year-end',values:[36.5,52.6,75.4],color:'#0f6b5c'},{name:'DOH · year-end',values:[78.2,95.4,118.2],color:'#c9a13b'}])}<p class="micro">${t==='profit'?'Earnings grew while operating cash generation collapsed; CFO is still positive.':'DOH +40 days, DSO +38.9 days; full CCC change unknown without DPO.'}</p></div><div class="card"><div class="card-header"><h3>Critical 2026 metrics</h3>${badge('GROUP INTERPRETATION')}</div>${(t==='profit'?['cfoNi','oneOff','grossMargin','operMargin']:['dso','doh','arRev','invRev']).map(id=>{let r=FIN.ratios.find(x=>x.id===id);return `<div class="metricline"><div><b class="small">${r.name}</b><div class="micro">${r.meaning}</div></div><div class="num">${num(r.values[2],1)}${r.unit}<div><button class="mini" data-fact-add="${r.id}">Copy evidence +</button></div></div></div>`}).join('')}</div></div>${cfoSupplementalCharts(t)}<div class="card" style="margin-top:15px"><div class="card-header"><h3>2024–2026 ratio table</h3>${badge('GROUP INTERPRETATION')}</div>${financeTable(t)}${selected?`<div class="notice info" style="margin-top:14px"><b>${esc(selected.name)}</b> · ${esc(selected.formula)}<p>${esc(selected.how)}</p><span class="micro">${esc(selected.meaning)}</span></div>`:''}${factsFoot()}</div>`}<div style="height:15px"></div><div class="grid cols-3"><div class="card tight"><span class="eyebrow">CASH VS PROFIT</span><h3 style="margin-top:8px">NI − CFO = 900bn</h3><p class="small">Do not attribute all 900bn to receivables or stock without an indirect CFO bridge.</p></div><div class="card tight"><span class="eyebrow">ONE-OFF GAIN</span><h3 style="margin-top:8px">320bn · not recurring</h3><p class="small">Tax consequences are unavailable, so 1,150 − 320 = 830 is mechanical only.</p></div><div class="card tight"><span class="eyebrow">CASH CONVERSION</span><h3 style="margin-top:8px">193.6 days ≠ CCC</h3><p class="small">Only DSO + DOH proxy. Payables and average DPO are missing.</p></div></div>`}
function workingCapitalCalc(dso,doh){const ar=Math.max(0,3100-15000*Number(dso)/365),inv=Math.max(0,3400-10500*Number(doh)/365);return {ar,inv,total:ar+inv}}
function actionKpi(){const quarters=['Q1/2027','Q2/2027','Q3/2027','Q4/2027'];return `<div class="card"><div class="card-header"><h3>2027 Five-KPI Dashboard · proposed policy</h3>${badge('PROPOSED POLICY')}</div><div class="table-wrap"><table class="data-table"><thead><tr><th>KPI</th><th>2026 baseline</th><th>Q4 target</th>${quarters.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${CFO5.map((k,i)=>`<tr><td><b>${k.name}</b></td><td>${k.base}</td><td>${k.target}</td>${quarters.map((q,j)=>`<td><input class="field" type="number" step="any" style="width:84px;padding:7px" data-field="setKpiActual" data-index="${i}" data-quarter="${j}" placeholder="—" value="${esc(S.kpiActuals?.[`${i}-${j}`]??'')}"></td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="micro">Blank means no company data supplied. Do not interpret N/A as zero. RAG assessment: green if target met, amber improving versus previous period, red deteriorating or missing (for live monitoring).</p><div class="grid cols-3" style="margin-top:13px">${CFO5.slice(0,3).map((k,i)=>{const val=S.kpiActuals?.[`${i}-3`];const x=Number(val),green=val!==undefined&&val!==''&&(k.dir==='high'?x>=k.goal:x<=k.goal);return `<div class="stat"><span class="eyebrow">Q4 2027 STATUS</span><h3 style="margin-top:9px">${k.name}</h3><div class="serif" style="font-size:24px">${val==null||val===''?'Not entered':esc(val)+' '+k.unit}</div><span class="badge ${val==null||val===''?'neutral':green?'ok':'warn'}">${val==null||val===''?'NOT AVAILABLE':green?'GREEN · TARGET MET':'CHECK PROGRESS'}</span></div>`}).join('')}</div></div>`}

function actionScenario(){const sc=S.scenario||{dso:65,doh:105,mode:'A'},x=workingCapitalCalc(sc.dso,sc.doh);return `<div class="grid cols-2"><div class="card"><div class="card-header"><h3>Working-capital release simulator</h3>${badge('GROUP INTERPRETATION')}</div><p class="small muted">Select A, B or C to load different targets instantly, or edit DSO/DOH for a custom case. Scenarios are alternatives, never additive. Holds 2026 revenue at 15,000bn and COGS at 10,500bn.</p><div class="tabbar" role="group" aria-label="Working capital scenarios">${[['A','KPI targets'],['B','2025 ratios'],['C','2024 ratios']].map(([m,n])=>`<button type="button" class="tab ${sc.mode===m?'selected':''}" data-scenario="${m}" aria-pressed="${sc.mode===m}">${m} · ${n}</button>`).join('')}${sc.mode==='custom'?`<span class="badge neutral" style="margin:auto 0 auto 8px">CUSTOM TARGET</span>`:''}</div><div class="input-grid"><div><label class="label">Target DSO · days</label><input class="field" type="number" step=".1" min="0" max="300" data-field="setScenario" data-col="dso" value="${Number(Number(sc.dso).toFixed(2))}"></div><div><label class="label">Target DOH · days</label><input class="field" type="number" step=".1" min="0" max="400" data-field="setScenario" data-col="doh" value="${Number(Number(sc.doh).toFixed(2))}"></div></div><p class="micro" style="margin-top:12px">AR release = 3,100 − 15,000 × target DSO / 365; inventory release = 3,400 − 10,500 × target DOH / 365.</p><div class="notice warning">Illustrative release, not new profit or a guaranteed 2027 cash inflow. No credit loss, collection costs or business expansion are included.</div></div><div class="card tinted"><span class="eyebrow">POTENTIAL WORKING CAPITAL RELEASE</span><h2 style="margin:12px 0 2px;font-size:45px">${num(x.total,0)} <span class="small">VND bn</span></h2><div class="metricline"><strong>Receivables release</strong><strong>${num(x.ar,0)}bn</strong></div><div class="metricline"><strong>Inventory release</strong><strong>${num(x.inv,0)}bn</strong></div>${releaseContributionChart(x)}<div class="metricline"><strong>Selected scenario</strong>${badge('GROUP INTERPRETATION','Scenario '+(sc.mode||'custom'))}</div><div class="notice" style="margin-top:16px">A: ≈808bn · B: 1,580bn · C: 2,750bn. These are mutually exclusive alternatives, not cumulative benefits.</div></div></div>`}
function actionSensitivity(){const v=S.sensitivity||{gain:320,warranty:1.6,tax:''};const warranty=15000*(Number(v.warranty)-0.9)/100,raw=1150-Number(v.gain)-warranty,hasTax=v.tax!==''&&Number.isFinite(Number(v.tax));const after=hasTax?1150-(Number(v.gain)+warranty)*(1-Number(v.tax)/100):null;return `<div class="grid cols-2"><div class="card"><h3>Earnings sensitivity bridge</h3><p class="small muted">Adjust assumptions for classroom scenarios. These are not audited normalization adjustments.</p><div class="form-row"><label class="label">Gain on warehouse sale removed (VND bn)</label><input class="field" type="number" step="1" min="0" data-field="setSensitivity" data-col="gain" value="${v.gain}"></div><div class="form-row"><label class="label">Warranty expense benchmark (% of revenue)</label><input class="field" type="number" step=".1" min="0" max="30" data-field="setSensitivity" data-col="warranty" value="${v.warranty}"></div><div class="form-row"><label class="label">Illustrative tax rate (%) · blank by default</label><input class="field" type="number" step=".1" min="0" max="100" data-field="setSensitivity" data-col="tax" placeholder="Not supplied by case" value="${esc(v.tax)}"></div><div class="notice warning">Never call the resulting number official normalized net income. The case lacks tax and provision roll-forward data.</div></div><div class="card"><div class="card-header"><h3>Illustrative sensitivity bridge</h3>${badge('GROUP INTERPRETATION')}</div><div class="metricline"><span>Reported 2026 net income</span><strong>1,150bn</strong></div><div class="metricline"><span>Less asset-sale gain · before tax adjustment</span><strong>−${num(v.gain,0)}bn</strong></div><div class="metricline"><span>Warranty expense sensitivity</span><strong>${warranty>=0?'−':'+'}${num(Math.abs(warranty),0)}bn</strong></div><div class="metricline"><span><strong>Mechanical arithmetic subtotal</strong></span><strong style="font-size:23px">${num(raw,0)}bn</strong></div>${hasTax?`<div class="metricline"><span>Simple tax-rate scenario (${v.tax}%)</span><strong>${num(after,0)}bn</strong></div>`:''}<div class="notice info">As provided by the source, 830 and 725 are strictly mechanical sensitivity steps, not usable as verified forecast net income or financing valuation.</div></div></div>`}
function cashCalc(){const arr=S.forecast||[];let previous=null,mins=[],rows=arr.map((r,i)=>{let complete=[r.inflows,r.outflows,r.essential].every(x=>x!==''&&x!=null);let opening=i===0?Number(r.opening||0):previous;let ending=complete&&(i>0?previous!==null:r.opening!==''&&r.opening!=null)?opening+Number(r.inflows)-Number(r.outflows):null;previous=ending;let facility=r.facility!==''?Number(r.facility):0;if(ending!==null)mins.push(ending+facility);return {...r,opening:i===0?r.opening:opening,ending,available:ending===null?null:ending+facility}});const ok=rows.length===13&&rows.every(x=>x.ending!==null),essential=rows.slice(0,4).reduce((s,r)=>s+Number(r.essential||0),0);return {rows,coverage:ok&&essential>0?Math.min(...mins)/essential:null}}
function actionForecast(){const f=cashCalc();return `<div class="card"><div class="card-header"><div><h3>13-week rolling cash forecast · blank by default</h3><p class="card-sub">Input VND bn. Only undrawn, committed and actually drawable facilities may be counted.</p></div>${badge('PROPOSED POLICY')}</div><div class="table-wrap"><table class="data-table"><thead><tr><th>Week</th><th>Opening</th><th>Cash inflows</th><th>Cash outflows</th><th>Committed drawable line</th><th>Essential expense</th><th>Ending cash</th></tr></thead><tbody>${f.rows.map((r,i)=>`<tr><td>${i+1}</td>${['opening','inflows','outflows','facility','essential'].map(k=>`<td>${k==='opening'&&i>0?`<span class="micro">${r.opening===null?'—':num(r.opening,1)}</span>`:`<input class="field" style="width:104px;padding:7px" type="number" step="any" data-field="setForecast" data-index="${i}" data-col="${k}" value="${esc((S.forecast[i]||{})[k]??'')}">`}</td>`).join('')}<td class="num">${r.ending===null?'—':num(r.ending,1)}</td></tr>`).join('')}</tbody></table></div><div class="notice ${f.coverage!==null&&f.coverage>=1?'success':'warning'}" style="margin-top:14px"><b>13-week cash coverage:</b> ${f.coverage===null?'Not available':num(f.coverage,2)+'×'} · minimum projected cash including committed drawable facilities / essential cash payments over first four weeks. Proposed goal ≥ 1.0×.</div><div class="button-row" style="margin-top:12px"><button class="btn outline small" data-action="load-cash-sample">Load SAMPLE numbers</button><button class="btn outline small" data-action="clear-cash">Clear all inputs</button></div><p class="micro" style="margin-top:12px">SAMPLE inputs are not VDG case facts. This forward-looking template cannot be populated reliably from the financial statement alone.</p></div>`}

function actionCCC(){const v=S.cccInputs||{ar:'',inv:'',ap:'',source:''};const ok=['ar','inv','ap'].every(k=>v[k]!==''&&Number(v[k])>=0)&&v.source?.trim().length>=8,ar=Number(v.ar),inv=Number(v.inv),ap=Number(v.ap),dso=ar/15000*365,doh=inv/10500*365,dpo=ap/10500*365;return `<div class="grid cols-2"><div class="card"><div class="card-header"><h3>CCC calculator · locked until sourced</h3>${badge('GROUP INTERPRETATION')}</div><p class="small">The original VDG case does not provide opening/average working-capital balances or DPO. Enter <b>verified average 2026 balances</b> from a documented source to unlock a calculation.</p>${[['ar','Average trade receivables (VND bn)'],['inv','Average inventory (VND bn)'],['ap','Average trade payables (VND bn)']].map(([k,n])=>`<div class="form-row"><label class="label">${n}</label><input class="field" type="number" min="0" step="any" data-field="setCcc" data-col="${k}" value="${esc(v[k]||'')}" placeholder="Not available in case"></div>`).join('')}<label class="label">Documented source / reference</label><textarea class="field textarea" rows="2" data-field="setCcc" data-col="source" placeholder="Document title, page/table and date required">${esc(v.source||'')}</textarea><div class="notice warning" style="margin-top:14px">Entering arbitrary DPO cannot unlock CCC. Only complete average-balance inputs with a credible source should be used.</div></div><div class="card tinted"><span class="eyebrow">WORKING-CAPITAL DAYS</span><div class="metricline"><b>Year-end DSO proxy</b><strong>75.4 days</strong></div><div class="metricline"><b>Year-end DOH proxy</b><strong>118.2 days</strong></div><div class="metricline"><b>DSO + DOH (proxy, NOT CCC)</b><strong>193.6 days</strong></div><div class="soft-line"></div>${ok?`${[['DSO · average',''+num(dso,1)+' days'],['DOH · average',num(doh,1)+' days'],['DPO · average',num(dpo,1)+' days'],['CCC · sourced inputs',num(dso+doh-dpo,1)+' days']].map(x=>`<div class="metricline"><b>${x[0]}</b><strong>${x[1]}</strong></div>`).join('')}<div class="notice success">Calculated using user-supplied averages. These are <b>not original case data</b>; verify the source before citation.</div>`:`<div class="notice warning">${icon('lock',15)} <b>TRUE CCC LOCKED.</b> Missing sourced average AR, inventory, payables balances. No definitive 2026 CCC will be shown.</div>`}</div></div>`}
function actionFunding(){return `<div class="grid cols-2"><div class="card"><h3>Funding priority · CFO R6</h3>${[['01','Internal cash & working-capital release','Validate collections and cash forecast; retain necessary operating liquidity.'],['02','Conditional short-term facilities','Bridge only evidenced, reversible gaps; evaluate repayment and bondholder protections.'],['03','Verified long-term financing / equity','Use for properly appraised long-term capex; disclose dilution and capital allocation.']].map(r=>`<div class="metricline"><div><span class="eyebrow">${r[0]}</span><h3 style="margin-top:6px">${r[1]}</h3><p class="micro">${r[2]}</p></div></div>`).join('')}<div class="notice">Ask CEO: “What is the 2027 funding requirement by quarter and use of proceeds?” The case gives no amount or optimal debt/equity mix.</div></div><div class="card"><h3>Six transparency commitments</h3>${COMMITMENTS.map((c,i)=>`<div class="metricline"><div style="flex:1"><label class="label">Commitment ${i+1}</label><textarea class="field textarea" rows="2" data-field="setCommitment" data-index="${i}" data-col="text">${esc((S.commitments?.[i]||{}).text??c)}</textarea><div class="input-grid" style="margin-top:8px"><input class="field" data-field="setCommitment" data-index="${i}" data-col="owner" placeholder="Owner" value="${esc((S.commitments?.[i]||{}).owner??'CFO')}"><select class="field" data-change="setCommitment" data-index="${i}" data-col="status">${['Proposed','Accepted','Modified','Rejected','Pending'].map(s=>`<option ${(S.commitments?.[i]||{}).status===s?'selected':''}>${s}</option>`).join('')}</select></div></div></div>`).join('')}</div></div>`}
function actionTracking(){const list=['AR aging, subsequent collections, payment and exchange terms','Inventory aging by SKU, write-downs and 2027 sell-through','NI-to-CFO, supplier payables/DPO, tax and warranty provision reconciliation','2027 capex schedule, use of proceeds and proposed funding needs'];return `<div class="grid cols-2"><div class="card"><h3>Evidence-request tracker</h3>${list.map((x,i)=>`<div class="form-row"><label class="label">Request ${i+1} · ${x}</label><div class="input-grid"><select class="field" data-change="setEvidenceRequest" data-index="${i}" data-col="status">${['Not requested','Requested','Received','No answer'].map(s=>`<option ${S.evidenceRequests?.[i]?.status===s?'selected':''}>${s}</option>`).join('')}</select><input class="field" data-field="setEvidenceRequest" data-index="${i}" data-col="asked" placeholder="Asked by / answered by" value="${esc(S.evidenceRequests?.[i]?.asked??'')}"></div></div>`).join('')}</div><div class="card"><h3>Stage-gate Board · CFO recommendation</h3>${S.conditions.map((c,i)=>`<div class="metricline"><div><strong class="small">${i+1}. ${c.title}</strong><div class="micro">${esc(S.conditions[i].owner)} · ${esc(S.conditions[i].deadline)}</div></div><select class="field" style="max-width:117px" data-change="setStageGate" data-index="${i}">${['Open','Pass','Fail'].map(s=>`<option ${S.stageGates?.[i]===s?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')}<div class="notice warning">A failed cash or evidence gate triggers a recommendation to defer or revise funding—not automatic approval of the next tranche.</div><h3 style="margin-top:20px">Stakeholder requests to CFO</h3>${S.notes.filter(n=>n.type==='REQUEST').map(n=>`<div class="note"><b class="small">${getRole(n.role).name} / ${getRole(n.role).groups[n.group==='B'?1:0]}</b><p class="small">${esc(n.text)}</p><span class="badge neutral">${esc(n.disposition||'PENDING')}</span></div>`).join('')||'<div class="empty">No real requests heard yet.</div>' const noteFields=[['CLAIM','Stakeholder position'],['EVIDENCE','Cited facts or figures'],['REQUEST','Action or supporting documents'],['QUESTION','Unresolved challenge']];
function noteCard(n,opts={}){const r=getRole(n.role),src=r.groups[n.group==='B'?1:0]+' / '+(n.speaker||'speaker not identified');return `<article class="note ${n.starred?'selected':''}"><div class="row" style="justify-content:space-between;flex-wrap:wrap">${badge(n.tag||'LIVE')}<span class="micro">${esc(src)} · ${shortTime(n.createdAt)}</span></div><p class="text">${esc(n.text)}</p><div class="note-bottom"><span class="source">${esc(n.author)} · ${esc(n.type)} ${n.verified?'· Verified':'· Requires validation'}</span><div class="note-actions"><button class="mini ${n.starred?'active':''}" data-note-toggle="${n.id}|starred">${icon('star',12)} Star</button><button class="mini ${n.verified?'active':''}" data-note-toggle="${n.id}|verified">${n.verified?'Verified':'Verify'}</button><button class="mini" data-note-edit="${n.id}" title="Edit note / Sửa ghi chú">${icon('edit',12)}</button><button class="mini danger-note" data-note-delete="${n.id}" title="Delete note / Xóa ghi chú">${icon('trash',12)} Xóa</button></div></div>${opts.showDetails?`<div class="input-grid" style="margin-top:12px">${[['type',['CLAIM','EVIDENCE','REQUEST','QUESTION','BOARD RESPONSE']],['stance',['UNCLEAR','APPROVE','OPPOSE','CONDITIONAL']],['lens',['CASH CONVERSION','ACCRUAL INTENSITY','SUSTAINABILITY','BALANCE-SHEET EVIDENCE','INCENTIVES & GOVERNANCE']],['topic',['Cash conversion','Receivables & distributor terms','Inventory','One-off gain','Warranty estimate','Exchange rights & revenue timing','Funding mix','Covenants & seniority','Dilution & dividends','Disclosure','Compensation','Audit & controls','Forecast base','Capex & funding need']],['disposition',['PENDING','ACCEPT','MODIFY','REJECT']],['linkedTo',['','Condition 1','Condition 2','Condition 3','KPI 1','KPI 2','KPI 3','Commitment','Evidence request']]].map(([fld,opts])=>`<div><label class="label">${fld}</label><select class="field" data-note-field="${n.id}|${fld}">${opts.map(o=>`<option value="${o}" ${fld==='linkedTo'?n.linkedTo?.includes(o)&&o?'selected':'':n[fld]===o?'selected':''}>${o||'No link yet'}</option>`).join('')}</select></div>`).join('')}</div><div class="row" style="margin-top:11px"><label class="micro"><input type="checkbox" data-note-impact="${n.id}" ${n.impact?'checked':''}> Could change earnings-quality rating / Board decision</label></div>`:''}</article>`}
function quickCapture(where='hearing'){const r=getRole(ui.role);return `<div class="quick-box" id="quick-capture"><div class="row" style="justify-content:space-between;flex-wrap:wrap"><div><b class="small">Quick capture · ${esc(r.name)}</b><div class="micro">Prefix c: claim · e: evidence · r: request · q: question</div></div><select class="field" style="width:105px" id="capture-group"><option value="A" ${ui.currentGroup==='A'?'selected':''}>${r.groups[0]}</option><option value="B" ${ui.currentGroup==='B'?'selected':''}>${r.groups[1]}</option></select></div><div class="input-grid" style="margin:12px 0"><input class="field" id="capture-speaker" placeholder="Actual speaker (or unknown)" value="${esc(window.speakerDraft||'')}"><select class="field" id="capture-type">${['CLAIM','EVIDENCE','REQUEST','QUESTION','BOARD RESPONSE'].map(t=>`<option ${ui.type===t?'selected':''}>${t}</option>`).join('')}</select></div><form class="quick-entry" id="quick-form"><input class="field" id="quick-text" placeholder="Capture only what was said · Enter to save" maxlength="4000" autocomplete="off"><button class="btn" type="submit">${icon('plus',14)} Capture</button></form><p class="micro" style="margin:9px 0 0">${badge('LIVE')} actual spoken testimony only. ${badge('SAMPLE')} never automatically becomes LIVE. Each note saves as a separate item.</p></div>`}
function roleSelector(){return `<div class="grid" style="gap:7px">${ROLES.map(r=>`<button class="meeting-role ${ui.role===r.id?'selected':''}" data-role="${r.id}"><span><strong>${String(r.order).padStart(2,'0')} · ${r.name}</strong><small>${r.groups.join(' + ')} · ${r.r} · ${r.block}</small></span>${countByRole(r.id)?badge('LIVE',countByRole(r.id)+' notes'):'<span class="micro">Empty</span>'}</button>`).join('')}</div>`}
const SAMPLE_NOTES={ceo:['CLAIM: Management may favor 2027 expansion based on 20% revenue growth.','QUESTION: What is the required funding amount by quarter and use?'],cfo:['EVIDENCE: CFO/NI dropped from 106.3% in 2024 to 21.7% in 2026.','REQUEST: Fund 2027 expansion in phases subject to collection and liquidity gates.'],bank:['CLAIM: Lenders need credible cash repayment evidence rather than EPS alone.','REQUEST: Provide cash forecast, receivables aging and realistic borrowing terms.'],bond:['QUESTION: Could new secured debt subordinate existing unsecured holders?','REQUEST: Review new security and bondholder protections.'],fund:['CLAIM: Sustainable value per share matters more than revenue growth.','REQUEST: Link bonuses to operating cash and core performance.'],minor:['QUESTION: What happens to dividends and shareholder dilution?','REQUEST: Disclose dilution and dividend framework before a share issue.'],audit:['EVIDENCE: Warranty expense/sales fell 1.6% to 0.9% despite stable claim levels.','REQUEST: Audit warranty provisioning and exchange contracts.'],chair:['REQUEST: Submit a three-condition, three-KPI conditional expansion resolution.','QUESTION: What evidence could trigger a deferred funding tranche?']};
function hearingPage(){const r=getRole(ui.role),notes=g=>S.notes.filter(n=>n.role===r.id&&n.group===g);return `${header('E','Stakeholder Hearing Notes','Eight roles, two A/B columns, four note types. Keep actual hearing records separate from models.',`${printButton()}<button class="btn outline small" data-action="export-notes">${icon('download',14)} Export .md</button>`)}${sourceExplanation()}<div style="height:15px"></div><div class="grid" id="hearing-grid" style="grid-template-columns:minmax(220px,270px) 1fr;align-items:start"><div class="card tight"><h3>Presentation order · Session 3</h3>${roleSelector()}<div class="soft-line"></div><p class="micro">Pre-talk: CEO notes first. Post-talk: capture the six later roles and your own CFO self-brief.</p></div><div class="grid"><div class="card"><div class="card-header"><div><span class="eyebrow">${r.block} · ${r.r} / ${r.groups.join(' + ')}</span><h2 style="margin:7px 0">${r.name}</h2><p class="small muted">${r.vi}</p></div><div class="dot-list">${ROLES.map(x=>`<span class="dot ${countByRole(x.id)?'filled':''}"></span>`).join('')}</div></div><div class="notice info"><b>What to listen for:</b> ${r.listen}${r.id==='cfo'?' · Self-brief: note the commitments actually made by your team.':''}</div>${quickCapture()}<div class="note-columns">${['A','B'].map(g=>`<div class="note-column"><div class="note-col-title">${r.groups[g==='A'?0:1]} · Group ${g}<span class="micro">${notes(g).length} notes</span></div>${noteFields.map(([type,detail])=>`<div class="note-section"><h4>${type} <span class="muted" style="text-transform:none;letter-spacing:0">· ${detail}</span></h4>${notes(g).filter(n=>n.type===type).map(n=>noteCard(n)).join('')||`<div class="empty">No real ${type.toLowerCase()} recorded</div>`}<button class="mini" style="margin-top:7px" data-preset-type="${g}|${type}">+ ${type.toLowerCase()}</button></div>`).join('')}${notes(g).filter(n=>n.type==='BOARD RESPONSE').map(n=>noteCard(n)).join('')}</div>`).join('')}</div><div class="card tight"><label class="label">A/B differences · only after both groups speak</label><textarea class="field textarea" rows="2" data-field="setDifference" data-key="${r.id}" placeholder="e.g. the two groups requested different safeguards">${esc(S.differences[r.id]||'')}</textarea><div class="row" style="justify-content:space-between;margin-top:12px"><b class="small">Reference samples</b><button class="btn outline small" data-action="sample-toggle">${ui.showSamples?'Hide examples':'Show SAMPLE notes'}</button></div>${ui.showSamples?`<div class="notice warning" style="margin-top:12px">${badge('SAMPLE')} These examples have NOT been spoken by any group.<ul style="margin-top:9px">${SAMPLE_NOTES[r.id].map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}</div></div></div></div><div class="notice" style="margin-top:17px">These notes are the <b>single source</b> for CFO Stakeholder Review & Response. Do not automatically attribute hypothetical numbers, financing terms, dividends, votes or agreement to other groups.</div>`}
function chosenCard(block){const subset=S.notes.filter(n=>getRole(n.role).block===block&&n.tag==='LIVE'&&n.speaker?.trim());const note=getSelected(block);return `<div class="card"><div class="card-header"><div><span class="eyebrow">${esc(block.toUpperCase())}</span><h3 style="margin-top:6px">Strongest actual argument</h3></div>${note?badge('LIVE','SOURCE SELECTED'):badge('SAMPLE','NOT YET HEARD')}</div><p class="micro">Choose a LIVE note with actual role, group and speaker. The Board cannot adopt imagined claims.</p><select class="field" data-change="setSynthesis" data-block="${block}"><option value="">— Select sourced LIVE note —</option>${subset.map(n=>`<option value="${n.id}" ${S.synthesis[block]===n.id?'selected':''}>${getRole(n.role).groups[n.group==='B'?1:0]} / ${esc(n.speaker)} · ${esc(n.text.slice(0,88))}</option>`).join('')}</select>${note?`<div class="notice success" style="margin-top:12px">${badge('LIVE')} ${esc(liveText(block))}</div>`:''}<label class="label" style="margin-top:15px">Important A/B or intra-block difference</label><textarea class="field textarea" data-field="setDifference" data-key="block-${block}" placeholder="Only source actual differences heard in class">${esc(S.differences['block-'+block]||'')}</textarea></div>`}
function deliberationPage(){const steps=['Sort','Verify','Synthesize','Respond','Design safeguards','Recommend'],n=ui.delibStep||1;return `${header('F','CFO Stakeholder Review & Response','Six CFO steps: capture and verify hearing evidence, respond to financial requests and prepare a sourced recommendation.',`<button class="btn outline small" data-action="export-minutes">${icon('download',14)} Export review & notes</button> ${printButton()}`)}<div class="notice info"><b>Division of authority:</b> Group 4 CFO advises on cash flow, funding, disclosures and feasible conditions. Group 3 Chair & Compensation Committee conducts Board deliberation and announces the Board’s final resolution. No notes or model answers imply unanimous agreement.</div><div class="stepper">${steps.map((x,i)=>`<button class="step ${i+1===n?'selected':''}" data-step="${i+1}"><span>${i+1}</span>${x}</button>`).join('')}</div><div class="substep">Step ${n}/6 · ${['Identify stakeholder requests and group-specific differences','Verify financial figures and flag missing sources','Select documented, attributable arguments by stakeholder block','Accept, modify or reject real REQUEST notes with an explanation','Link feasible responses to conditions, 2027 KPIs and funding safeguards','Export CFO working sheet for the Chair; do not claim Board adoption'][n-1]}</div>${n===1?delibSort():n===2?delibValidate():n===3?delibSynthesize():n===4?cfoDecisionTracker():n===5?delibConditions():delibWorking()}<div class="card" style="margin-top:17px"><div class="card-header"><h3>Supporting views · one Notes database</h3><span class="micro">By Role · Theme · Stance · Requests · Unverified · Timeline</span></div><div class="tabbar">${['By Role','By Theme','By Stance','Requests Register','Unverified','Timeline'].map(v=>`<button class="tab ${ui.delibView===v?'selected':''}" data-delib-view="${v}">${v}</button>`).join('')}</div>${delibViews()}</div>`}

function delibSort(){return `<div class="grid cols-2"><div class="card"><h3>Choose hearing role</h3>${roleSelector()}<label class="label" style="margin-top:15px">One-sentence English takeaway</label><textarea class="field textarea" data-field="setRoleSummary" data-key="${ui.role}" placeholder="Write only after listening">${esc(S.summaries[ui.role]||'')}</textarea></div><div class="card"><h3>Captured notes · ${getRole(ui.role).name}</h3>${S.notes.filter(n=>n.role===ui.role).slice().reverse().map(n=>noteCard(n,{showDetails:true})).join('')||'<div class="empty">No real stakeholder notes yet. Enter them in Hearing Notes.</div>'}</div></div>`}
function delibValidate(){const unverified=S.notes.filter(n=>!n.verified);return `<div class="grid cols-2"><div class="card"><h3>Case data cross-check</h3><p class="small">Compare quotations with the original VDG case, especially figures and timing.</p>${[['CFO/NI','106.3% / 62.0% / 21.7%'],['DSO proxy','36.5 / 52.6 / 75.4 days'],['DOH proxy','78.2 / 95.4 / 118.2 days'],['DSO + DOH ≠ CCC','193.6 days in 2026; DPO unknown'],['Warehouse asset-sale gain','VND 320bn; 27.8% of NI'],['Warranty cost ratio','1.6% → 0.9% despite stable claims']].map(x=>`<div class="metricline"><b class="small">${x[0]}</b><span class="small">${x[1]}</span></div>`).join('')}</div><div class="card"><div class="card-header"><h3>Unverified or unresolved notes</h3><span class="badge warn">${unverified.length} pending</span></div>${unverified.map(n=>noteCard(n,{showDetails:true})).join('')||'<div class="empty">All captured notes marked verified. Recheck source attribution.</div>'}</div></div>`}
function delibSynthesize(){return `<div class="grid cols-2">${['Management','Creditors','Equity Investors','Board'].map(chosenCard).join('')}</div><div class="notice" style="margin-top:15px">Management includes CEO and CFO; Creditors includes Commercial Bank and Bondholders; Equity includes Institutional and Minority; Board includes Audit & Risk and Chair. Selected quotations must retain their original sources.</div>`}
function delibConflicts(){return `<div class="card"><div class="card-header"><h3>Stakeholder conflicts and Board response</h3>${badge('GROUP INTERPRETATION','POTENTIAL CONFLICTS')}</div><div class="grid cols-2">${CONFLICTS.map(c=>{const x=S.conflicts[c.id]||{status:'Open'};return `<div class="stat"><div class="row" style="justify-content:space-between"><b>${c.pair}</b><span class="badge ${x.status==='Resolved'?'ok':'warn'}">${x.status||'Open'}</span></div><p class="small muted" style="margin-top:10px">${c.description}</p><div class="input-grid"><div><label class="label">Who enjoys upside?</label><input class="field" data-field="setConflict" data-id="${c.id}" data-col="upside" value="${esc(x.upside||'')}"></div><div><label class="label">Who bears downside?</label><input class="field" data-field="setConflict" data-id="${c.id}" data-col="downside" value="${esc(x.downside||'')}"></div></div><label class="label" style="margin-top:11px">Governance response</label><select class="field" data-change="setConflict" data-id="${c.id}" data-col="mechanism"><option value="">Choose mechanism</option>${c.mechanisms.map(t=>`<option ${x.mechanism===t?'selected':''}>${t}</option>`).join('')}</select><textarea class="field textarea" rows="2" style="margin-top:10px" data-field="setConflict" data-id="${c.id}" data-col="response" placeholder="Link actual stakeholder evidence to a safeguard">${esc(x.response||'')}</textarea><div class="row" style="justify-content:space-between;margin-top:9px"><label class="micro">Status</label><select class="field" style="max-width:140px" data-change="setConflict" data-id="${c.id}" data-col="status">${['Open','Resolved'].map(v=>`<option ${x.status===v?'selected':''}>${v}</option>`).join('')}</select></div></div>`}).join('')}</div></div>`}
function delibConditions(){return `<div class="grid cols-2"><div class="card"><h3>Three stage-gate conditions · draft</h3>${S.conditions.map((c,i)=>`<div class="form-row"><label class="label">Condition ${i+1}: ${esc(c.title)}</label><textarea class="field textarea" rows="3" data-field="setCondition" data-index="${i}" data-col="text">${esc(c.text)}</textarea><div class="input-grid"><input class="field" data-field="setCondition" data-index="${i}" data-col="owner" value="${esc(c.owner)}" placeholder="Owner"><input class="field" data-field="setCondition" data-index="${i}" data-col="deadline" value="${esc(c.deadline)}" placeholder="Deadline"></div></div>`).join('')}</div><div class="card"><h3>Three resolution monitoring KPIs</h3>${S.kpis.map((k,i)=>`<div class="metricline"><div><b class="small">${k.name}</b><div class="micro">2026 baseline: ${k.baseline}</div></div><input class="field" style="max-width:125px" data-field="setKpi" data-index="${i}" data-col="target" value="${esc(k.target)}"></div>`).join('')}<div class="notice info" style="margin-top:15px">The wider CFO dashboard has five KPIs. The <b>Board resolution includes only three</b> monitoring KPIs: CFO/NI ≥60%, DSO ≤65 days, DOH ≤105 days by Q4/2027. All are proposals.</div><div class="soft-line"></div><h3>Decision alternatives</h3>${[['Approve with Conditions','Collections verified, inventory/warranty appropriate, forecast adequate'],['Defer / revise financing','Aging, warranty, DPO or capex remains unresolved'],['Reject high-risk tranche','Material loss or cash shortfall without viable mitigation']].map(x=>`<div class="metricline"><b class="small">${x[0]}</b><span class="micro">${x[1]}</span></div>`).join('')}</div></div>`}
const WORK_LABELS=[['Management','CEO / Management strongest argument'],['Creditors','Creditors strongest concern'],['Equity Investors','Equity investors strongest concern'],['Board','Audit/Risk and Chair key challenge'],['conflicts','Major stakeholder conflicts'],['resolution','CFO recommendation and safeguards']];
function delibWorking(){return `<div class="card"><div class="card-header"><div><h3>CFO Stakeholder Response · Working sheet</h3><p class="card-sub">Blank / LIVE by default; illustrative answer is strictly separate.</p></div><div class="button-row"><button class="btn ${ui.model?'outline':''} small" data-action="working-live">Blank / LIVE</button><button class="btn ${!ui.model?'outline':''} small" data-action="working-sample">SAMPLE model answer</button></div></div>${ui.model?`<div class="notice warning">${badge('SAMPLE')} This text has NOT been spoken by stakeholders; do not quote as LIVE.</div>`:''}${WORK_LABELS.map(([k,l],i)=>{const text=ui.model?MODEL[k]:S.worksheet[k]||liveText(k)||'';return `<div class="form-row" style="margin-top:13px"><label class="label">0${i+1} · ${l}</label>${ui.model?`<div class="notice">${esc(text)}</div>`:`<textarea class="field textarea" rows="3" data-field="setWorksheet" data-key="${k}" placeholder="Sourced notes only; keep blank if not heard">${esc(text)}</textarea>`}</div>`}).join('')}${!ui.model?`<div class="notice info" style="margin:16px 0"><b>CFO responses linked from actual REQUEST notes</b><pre style="font-family:inherit;white-space:pre-wrap;margin:9px 0 0;font-size:12px">${esc(decisionTrackerSummary()||'[No CFO stakeholder request has been processed yet]')}</pre></div>`:''}<div class="button-row"><button class="btn" data-action="push-to-resolution">${icon('arrow',14)} Push selected sources to resolution</button><button class="btn outline" data-action="export-minutes">${icon('download',14)} Export minutes</button></div></div>`}
function delibViews(){const ns=S.notes;switch(ui.delibView){case 'By Role':return `<div class="grid cols-2">${ROLES.map(r=>`<div class="stat"><strong>${r.name}</strong><span class="micro" style="float:right">${r.groups.join(' / ')}</span>${ns.filter(n=>n.role===r.id).slice(-3).map(n=>`<p class="small">${badge('LIVE')} ${esc(n.text.slice(0,170))}</p>`).join('')||'<p class="micro">No real notes recorded</p>'}</div>`).join('')}</div>`;case 'By Theme':{const themes=[...new Set(ns.map(n=>n.topic||'Unclassified'))];return themes.length?`<div class="grid cols-2">${themes.map(x=>`<div class="stat"><b>${esc(x)}</b>${ns.filter(n=>(n.topic||'Unclassified')===x).map(n=>`<p class="small">${esc(n.text)} <span class="micro">${getRole(n.role).groups[n.group==='B'?1:0]}</span></p>`).join('')}</div>`).join('')}</div>`:'<div class="empty">No notes yet</div>'}case 'By Stance':return `<div class="table-wrap"><table class="data-table"><thead><tr><th>Role</th>${['APPROVE','OPPOSE','CONDITIONAL','UNCLEAR'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${ROLES.map(r=>`<tr><td>${r.name}</td>${['APPROVE','OPPOSE','CONDITIONAL','UNCLEAR'].map(k=>`<td>${ns.filter(n=>n.role===r.id&&n.stance===k).length}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;case 'Requests Register':return `<div class="button-row" style="margin-bottom:10px"><button class="btn outline small" data-action="export-requests">Download CSV</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Source</th><th>Request</th><th>Disposition</th></tr></thead><tbody>${ns.filter(n=>n.type==='REQUEST').map(n=>`<tr><td>${getRole(n.role).groups[n.group==='B'?1:0]}</td><td style="white-space:normal">${esc(n.text)}</td><td>${esc(n.disposition)}</td></tr>`).join('')||'<tr><td colspan="3">No live requests captured</td></tr>'}</tbody></table></div>`;case 'Unverified':return `<div class="grid cols-2">${ns.filter(n=>!n.verified||n.type==='QUESTION').map(n=>noteCard(n)).join('')||'<div class="empty">No unverified notes.</div>'}</div>`;case 'Timeline':return `<div class="timeline">${ns.slice().sort((a,b)=>a.createdAt.localeCompare(b.createdAt)).map(n=>`<div class="timeline-item"><b class="small">${getRole(n.role).name} · ${getRole(n.role).groups[n.group==='B'?1:0]}</b><small>${shortTime(n.createdAt)} · ${n.author}</small><p class="small">${esc(n.text)}</p></div>`).join('')||'<p class="micro">Timeline begins after live capture.</p>'}</div>`;default:return ''}}
function finalWarnings(){const problems=[];if(S.conditions.length!==3)problems.push('Exactly three conditions required.');if(S.kpis.length!==3)problems.push('Exactly three resolution monitoring KPIs required.');if(S.conditions.some(c=>!c.text?.trim()||!c.owner?.trim()||!c.deadline?.trim()))problems.push('Every condition needs text, owner and timing.');if(S.kpis.some(k=>!k.target?.trim()))problems.push('All monitoring KPIs need numeric proposed targets.');if(guardScan(generatedResolution()).length)problems.push('Claim guardrail checker detected unsupported statements.');return problems}
function generatedResolution(){const r=S.resolution;return `CFO RECOMMENDATION TO THE BOARD — WORKING DRAFT (NOT ADOPTED)\nVIET DIGITAL CONSUMER JSC (VDG) · SESSION 3 · 2027 EXPANSION\n\nCFO RECOMMENDATION: ${r.decision}\nThe CFO recommends conditional and phased approval of the 2027 expansion programme, subject to independent validation of 2026 earnings quality and satisfactory near-term liquidity protection. This is a recommendation; only the Board through its Chair can approve an official resolution. No automatic release of the full programme is authorised.\n\nTHREE PROPOSED CONDITIONS\n${S.conditions.map((c,i)=>`${i+1}. ${c.title}: ${c.text} Owner: ${c.owner}. Timing: ${c.deadline}.`).join('\n')}\n\nTHREE PROPOSED MONITORING KPIS (Q4/2027)\n${S.kpis.map((k,i)=>`${i+1}. ${k.name}: ${k.target}; 2026 baseline ${k.baseline}.`).join('\n')}\n\nFINANCIAL RATIONALE [CASE DATA / GROUP INTERPRETATION]\n2026 revenue rose 20% to VND 15,000bn and net income rose 15% to VND 1,150bn. Operating CFO remained positive at VND 250bn but fell 59.7%. CFO/NI fell from 106.3% (2024) to 21.7% (2026). Receivables and inventory grew faster than sales; VND 320bn of gain came from non-recurring warehouse disposal. Warranty expense/revenue fell from 1.6% to 0.9% despite warranty claims not materially declining. CCC cannot be calculated because DPO is unavailable.\n\nACTUAL STAKEHOLDER REFERENCES [LIVE, ONLY IF RECORDED]\n${['Management','Creditors','Equity Investors','Board'].map(b=>b+': '+(liveText(b)||'[No actual attributed LIVE source selected]')).join('\n')}\n\nCFO RESPONSES TO DOCUMENTED STAKEHOLDER REQUESTS [PROPOSED POLICY]\n${decisionTrackerSummary()||'[No documented responses entered]'}\n\nADDITIONAL CFO RATIONALE\n${r.rationale||'[Pending]'}\n\nDISSENT / COUNTERARGUMENT\n${r.dissent||'[Not yet recorded; do not infer unanimity]'}\n\nBOARD REVIEW TRIGGER\n${r.review||'The Board should review cash conversion, inventory/warranty evidence and the 13-week liquidity forecast before subsequent expansion tranches.'}\n\nACTUAL BOARD OUTCOME (SEPARATE, STUDENT-RECORDED)\n${S.boardOutcome?.decision?`Outcome: ${S.boardOutcome.decision}; announced by ${S.boardOutcome.announcedBy||'[source missing]'}; date ${S.boardOutcome.announcedAt||'[not recorded]'}; conditions: ${S.boardOutcome.conditions||'[not recorded]'}; dissent: ${S.boardOutcome.dissent||'[not recorded]'}`:'[Not announced or not recorded in this workspace]'}\n\nPROVENANCE / GOVERNANCE\nAll numeric 2027 targets are GROUP 4 PROPOSED POLICY, not case facts or prior Board decisions. The CFO provides advice; R5 Chair & Compensation Committee records the adopted outcome and any dissent. No invented WACC, DSCR, DPO, financing amounts, covenant thresholds or payout ratios.`}
function officialDraftHTML(){return `<div class="board-document" id="resolution-print"><div class="doc-meta">FIN470 · SESSION 03 · CFO R6 · GROUP 4A + 4B</div><h2>CFO Recommendation to the Board</h2><div class="doc-meta">VIET DIGITAL CONSUMER JSC · VDG · 2027 EXPANSION</div><div class="soft-line"></div><div class="row" style="justify-content:center">${badge('PROPOSED POLICY','ILLUSTRATIVE CFO DRAFT')}<span class="badge neutral">NOT AN ADOPTED DECISION</span></div><p style="margin-top:25px">The CFO recommends conditional and phased approval of the 2027 expansion, subject to verification of earnings quality and sufficient short-term liquidity. Each material financing or capex tranche is subject to separate Board review; this draft does not constitute an authorised release of capital.</p><h3>Recommended Decision</h3><p><b>${esc(S.resolution.decision||'Approve with Conditions')}</b> ${badge('PROPOSED POLICY')}</p><h3>Three Proposed Conditions</h3><ol>${S.conditions.map(c=>`<li><b>${esc(c.title)}.</b> ${esc(c.text)}<p class="micro">Owner: ${esc(c.owner)} · Review: ${esc(c.deadline)}</p></li>`).join('')}</ol><h3>Three Proposed Monitoring KPIs</h3><ol>${S.kpis.map(k=>`<li><b>${esc(k.name)}:</b> ${esc(k.target)} by Q4/2027 (baseline: ${esc(k.baseline)}). ${badge('PROPOSED POLICY')}</li>`).join('')}</ol><h3>Evidence-Based Financial Rationale</h3><p>2026 revenue grew 20%, net income grew 15%, but operating CFO fell 59.7% to a still-positive VND 250bn. CFO/NI declined from 106.3% in 2024 to 21.7% in 2026. Receivables and inventory increased much faster than sales. VND 320bn of reported gain from the warehouse sale will not recur, and lower warranty expense assumptions require verification.</p>${S.resolution.rationale?`<p>${esc(S.resolution.rationale)}</p>`:''}<h3>Actual Stakeholder References</h3>${['Management','Creditors','Equity Investors','Board'].map(b=>`<p><b>${b}:</b> ${getSelected(b)?badge('LIVE')+' '+esc(liveText(b)):'<span class="micro">[No sourced LIVE quotation selected]</span>'}</p>`).join('')}<h3>Review, Dissent and Authority</h3><p><b>Review trigger:</b> ${esc(S.resolution.review||'Quarterly Board review; defer further tranches if collections, inventory/warranty checks or cash forecast gates fail.')}</p><p><b>Dissent / counterargument:</b> ${esc(S.resolution.dissent||'[Not yet documented; do not assume unanimous consent]')}</p><div class="callout-quote" style="margin-top:17px">“Growth should be financed by credible cash flows, not by headline EPS alone.”</div><p class="micro" style="margin-top:22px">All numeric targets and conditions above are CFO proposals. Chair/Board alone may adopt final resolution and must record the actual outcome and dissent. This educational draft is not an audited financial statement.</p></div>`}
function resolutionPage(){const w=finalWarnings(),tab=ui.resolutionTab||'form',reviewed=S.resolution.votes?.length||0;return `${header('G','CFO Recommendation to the Board','CFO proposal and a separate log for the actual Chair-announced outcome; internal review is not Board adoption.',`${printButton()}<button class="btn outline small" data-action="export-resolution">${icon('download',14)} Export Markdown</button>`)}<div class="requirement"><b>Authority:</b> The CFO may recommend three conditions and three monitoring KPIs. Do not claim the Board has adopted them until the Chair reads back the actual outcome. Record dissent where applicable.</div><div class="tabbar">${[['form','Fill-in form'],['official','Official-style English draft'],['versions','Version history'],['outcome','Actual Board outcome · LIVE']].map(([k,n])=>`<button class="tab ${tab===k?'selected':''}" data-resolution-tab="${k}">${n}${k==='versions'?` (${S.versions.length})`:''}</button>`).join('')}</div><div class="grid cols-2" style="margin-bottom:15px"><div class="notice ${w.length?'warning':'success'}"><b>${w.length?w.length+' issue(s) need attention':'Structural checks passed'}</b>${w.map(x=>`<p class="micro" style="margin:3px 0">• ${x}</p>`).join('')||'<p class="micro">Review attribution and confirm actual Board decision separately.</p>'}</div><div class="card tight"><div class="row" style="justify-content:space-between"><div><span class="eyebrow">GROUP INTERNAL REVIEW</span><h2 style="margin:4px 0">${reviewed} / 6</h2></div>${badge('PROPOSED POLICY','CFO DRAFT')}</div><p class="micro">Four team confirmations mark an internally reviewed <em>draft</em>, not an adopted Board resolution.</p></div></div>${tab==='form'?`<div class="grid cols-2"><div class="card"><h3>1 · CFO Recommended Decision</h3><div class="decision-options">${[['Approve','Approve'],['Reject','Reject'],['Approve with Conditions','Conditional / staged']].map(([a,b])=>`<button class="choice ${S.resolution.decision===a?'selected':''}" d textarea><h3 style="margin-top:17px">Actual LIVE sources selected</h3><p class="micro">The response tracker below remains Group 4 CFO proposals, not creditor acceptance or Board approval.</p><div class="notice info" style="white-space:pre-wrap;margin-bottom:13px">${esc(decisionTrackerSummary()||'No captured stakeholder requests have received a CFO disposition yet.')}</div>${['Management','Creditors','Equity Investors','Board'].map(b=>`<p class="small"><b>${b}:</b> ${liveText(b)?badge('LIVE')+' '+esc(liveText(b)):'[Not selected]'}</p>`).join('')}</div></div><div class="card" style="margin-top:15px"><div class="button-row"><button class="btn" data-action="push-to-resolution">Sync sourced notes</button><button class="btn outline" data-action="snapshot">Save version snapshot</button><button class="btn outline" data-resolution-tab="official">Preview draft</button><button class="btn outline" data-action="vote" ${w.length?'disabled':''}>${icon('check',14)} Confirm internal review</button></div><p class="micro" style="margin-top:10px">This review control never implies formal Board approval. The actual Chair must announce the official decision.</p></div>`:tab==='official'?`${officialDraftHTML()}<div class="button-row" style="justify-content:center;margin-top:15px"><button class="btn outline" data-action="export-resolution">Export Markdown</button><button class="btn" data-action="print">Print / PDF</button><button class="btn outline" data-action="export-docx">Export DOCX</button></div>` : tab==='outcome'? `<div class="grid cols-2"><div class="card"><span class="eyebrow">ACTUAL BOARD OUTCOME · ENTER ONLY WHEN ANNOUNCED</span><h3 style="margin-top:10px">Record what Group 3 Chair actually decided</h3><div class="notice warning" style="margin-bottom:16px">Blank by default. Do not copy the proposed CFO decision here or mark it as adopted before the Chair actually announces it. No stakeholder consensus is inferred.</div><div class="form-row"><label class="label">Decision announced by Chair</label><select class="field" data-change="setBoardOutcome" data-col="decision"><option value="">Not announced / not recorded</option>${['Approve','Reject','Approve with Conditions','Defer / Revise','Other (describe in notes)'].map(x=>`<option ${S.boardOutcome?.decision===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-row"><label class="label">Group 3 Speaker / Source</label><input class="field" data-field="setBoardOutcome" data-col="announcedBy" value="${esc(S.boardOutcome?.announcedBy||'')}" placeholder="Group 3A/3B; name of actual speaker"></div><div class="form-row"><label class="label">Hearing session/date or announcement time</label><input class="field" data-field="setBoardOutcome" data-col="announcedAt" value="${esc(S.boardOutcome?.announcedAt||'')}" placeholder="Record the real class session"></div><label class="label">Actual conditions, owners and deadlines (quote/summary)</label><textarea class="field textarea" rows="4" data-field="setBoardOutcome" data-col="conditions" placeholder="Leave blank until Chair states them">${esc(S.boardOutcome?.conditions||'')}</textarea><label class="label" style="margin-top:13px">Recorded dissent or counterargument</label><textarea class="field textarea" rows="3" data-field="setBoardOutcome" data-col="dissent" placeholder="Record actual dissent, or state none recorded if explicitly confirmed">${esc(S.boardOutcome?.dissent||'')}</textarea><label class="label" style="margin-top:13px">Other remarks / verification</label><textarea class="field textarea" rows="3" data-field="setBoardOutcome" data-col="notes">${esc(S.boardOutcome?.notes||'')}</textarea></div><div class="card"><h3>Proposed CFO decision vs actual Board decision</h3><div class="metricline"><span>CFO recommended</span><b>${esc(S.resolution.decision)}</b></div><div class="metricline"><span>Chair announced</span><b>${esc(S.boardOutcome?.decision||'Not recorded')}</b></div><div class="metricline"><span>Source</span><b>${esc(S.boardOutcome?.announcedBy||'Not recorded')}</b></div><p class="small" style="margin-top:18px">Internal team reviews: ${S.resolution.votes?.length||0} / 6. These confirm draft review only, never a formal Board vote.</p><div class="notice info">To share the recorded outcome with Group 4, run the Node server. This section is separate from the proposed resolution and remains blank until manually filled.</div></div></div>` : `<div class="grid cols-2"><div class="card"><h3>Snapshots</h3>${S.versions.map(v=>`<div class="metricline"><div><b class="small">${new Date(v.at).toLocaleString()}</b><p class="micro">${esc(v.author)}</p></div><button class="btn outline small" data-restore="${v.id}">Restore</button></div>`).join('')||'<div class="empty">No saved versions yet</div>'}</div><div class="card"><h3>Original CFO recommendation</h3>${CONDITIONS.map((c,i)=>`<p class="small"><b>${i+1}. ${c.title}</b><br>${c.text}</p>`).join('')}<div class="notice info">Board targets: CFO/NI ≥60%; DSO ≤65d; DOH ≤105d.</div></div></div>`}<p class="micro" style="margin-top:15px">Case data and 2027 proposed targets are not interchangeable. The final Chair resolution, if delivered in class, must be recorded separately and accurately.</p>`}

)}</select></div></div>`).join('')||'<p class="micro" style="margin-top:17px">No questions entered yet.</p>'}</div></div>`:t==='formula'?`<div class="card"><h3>Formula cheat sheet · VDG 2026</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>Measure</th><th>Formula</th><th class="num">2026 (derived)</th></tr></thead><tbody>${FIN.ratios.map(r=>`<tr><td><b>${r.name}</b></td><td>${esc(r.formula)}</td><td class="num">${num(r.values[2],r.id==='operMargin'?2:1)}${r.unit}</td></tr>`).join('')}</tbody></table></div><div class="notice" style="margin-top:14px">True CCC = DSO + DOH − DPO; true CCC is not available. Year-end working-capital balances are not the average-balance method.</div></div>`:t==='checklist'?`<div class="grid cols-2"><div class="card"><div class="card-header"><h3>Group 4 checklist</h3><b>${CHECKS.filter(([k])=>S.checklist[k]).length}/${CHECKS.length}</b></div><div class="ring-progress"><span style="width:${CHECKS.filter(([k])=>S.checklist[k]).length/CHECKS.length*100}%"></span></div>${CHECKS.map(([k,v])=>`<label class="check-row"><input type="checkbox" data-check="${k}" ${S.checklist[k]?'checked':''}><span>${v}</span></label>`).join('')}</div><div class="card"><h3>Automated readiness</h3>${readiness().checks.map(([n,ok,page])=>`<button class="meeting-role" style="margin-bottom:7px" data-nav="${page}"><span class="small">${ok?icon('check',14):icon('warning',14)} ${n}</span><span class="badge ${ok?'ok':'warn'}">${ok?'Ready':'Missing'}</span></button>`).join('')}</div></div>`:`<div class="card"><h3>Source ledger</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>Source</th><th>Supports</th><th>Label</th></tr></thead><tbody>${[['Session 3 original case, PDF pp.1–2','Financial data, distributor terms, warehouse gain, warranty costs','CASE DATA'],['Week 3 class role schedule Excel','21–23 October 2026; Group 4A + 4B = CFO R6','CASE DATA'],['Group 4 CFO integrated handbook','Analysis, scripts, notes guidelines and draft conditions','GROUP INTERPRETATION'],['Group 4 proposed financing plan','Targets, conditions, funding priority','PROPOSED POLICY'],['Captured hearing notes','Actually stated stakeholder claims (role/group/speaker)','LIVE']].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${badge(x[2])}</td></tr>`).join('')}</tbody></table></div><div class="notice" style="margin-top:13px">VDG is fictional. Website is an educational simulation and is not an audit opinion or a real corporate decision.</div></div>`}`}
function liveMode(){const r=getRole(ui.role),ns=S.notes.filter(n=>n.role===r.id).slice().reverse().slice(0,12);return `${header('LIVE','Classroom Capture Mode','Focus on the currently speaking group.',`<button class="btn outline" data-action="live">Exit Live Mode</button>`)}<div class="card"><div class="row" style="justify-content:space-between;flex-wrap:wrap"><div><span class="eyebrow">NOW SPEAKING</span><h1 style="margin:8px 0">${r.name} <span class="muted" style="font-size:16px">${r.groups.join(' / ')}</span></h1><p class="small muted">${r.listen}</p></div><div><div class="timer-face" id="liveclock">08:00</div><button class="btn outline small" data-action="live-timer">${ui.clockRunning?'Pause':'Start'} 8:00 timer</button></div></div>${quickCapture()}<div class="row" style="gap:5px;overflow-x:auto;margin-top:17px">${ROLES.map((r,i)=>`<button class="pill ${r.id===ui.role?'selected':''}" data-role="${r.id}">${i+1}. ${r.name}</button>`).join('')}</div><div class="soft-line"></div><h3>Recent live notes · ${ns.length}</h3><div class="grid cols-2">${ns.map(n=>noteCard(n)).join('')||'<div class="empty">No notes captured for this role</div>'}</div></div><div class="notice" style="margin-top:13px">Shortcuts: 1–8 select role · Enter save · Ctrl/Cmd+S star most recent. No hypothetical statements can be automatically marked LIVE.</div>`}

function saveBlob(text,name,type='text/markdown;charset=utf-8'){const blob=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
function noteMarkdown(){return `# FIN470 — STAKEHOLDER HEARING NOTES\nGenerated ${new Date().toLocaleString()}\n\nNOTE: LIVE text below comes from manual hearing capture, not case facts or sample.\n\n`+ROLES.map(r=>`## ${r.order}. ${r.name} (${r.groups.join(' / ')})\nListen for: ${r.listen}\n\n`+['A','B'].map(g=>`### Group ${r.groups[g==='A'?0:1]}\n`+S.notes.filter(n=>n.role===r.id&&n.group===g).map(n=>`- [LIVE] **${n.type}** — ${n.text}\n  - Speaker: ${n.speaker||'not identified'}; author: ${n.author}; time: ${n.createdAt}\n  - Disposition: ${n.disposition}; verified: ${n.verified?'YES':'NO'}; link: ${(n.linkedTo||[]).join(', ')||'none'}`).join('\n')+`\n`).join('\n')+`A/B difference: ${S.differences[r.id]||'[blank]'}\n`).join('\n')}
function meetingMarkdown(){return `${noteMarkdown()}\n\n# BOARD DELIBERATION\n${WORK_LABELS.map(([key,label])=>`## ${label}\n${S.worksheet[key]||liveText(key)||'[blank]'}\n`).join('\n')}\n## Conflicts register\n${CONFLICTS.map(c=>`- **${c.pair}**: ${c.description} → Board remedy: ${S.conflicts[c.id]?.response||'[open]'}; status ${S.conflicts[c.id]?.status||'Open'}`).join('\n')}\n\n# FINAL RESOLUTION\n${generatedResolution()}\n`}

function makeDocxBytes(){
 const enc=new TextEncoder();
